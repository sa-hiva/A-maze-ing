[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator and solver module for 42."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE.md"]
authors = [
    { name = "valmoral", email = "valmoral@student.42urduliz.com" },
    { name = "shierro", email = "shierro@student.42urduliz.com" }
]

[tool.setuptools.packages.find]
include = ["mazegen*"]
